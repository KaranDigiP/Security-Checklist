<!DOCTYPE html>
<html>
<head>
  <title>Google Security Checklist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body class="bg-gray-100 p-8">

<!-- ACCESS CONTROL -->
<div id="authScreen" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-50">
  <div class="bg-white p-8 rounded-xl shadow w-96">
    <h2 class="text-xl font-semibold mb-4">Restricted Access</h2>
    <input type="password" id="passwordInput"
      class="w-full p-2 border rounded mb-4"
      placeholder="Enter access password">
    <button onclick="checkPassword()"
      class="w-full bg-blue-600 text-white p-2 rounded">
      Access
    </button>
  </div>
</div>

<h1 class="text-3xl font-bold mb-6 text-gray-800">
  Google Security Checklist
</h1>

<button onclick="exportPDF()" class="mb-6 bg-gray-800 text-white px-4 py-2 rounded">
Export to PDF
</button>

<!-- Overall Completion -->
<div class="mb-8">
  <div class="flex justify-between mb-1">
    <span class="text-sm font-medium text-gray-700">Overall Completion</span>
    <span id="overallPercent" class="text-sm text-gray-700">0%</span>
  </div>
  <div class="w-full bg-gray-200 rounded-full h-3">
    <div id="overallBar" class="bg-green-500 h-3 rounded-full" style="width:0%"></div>
  </div>
</div>

<div id="app" class="space-y-12"></div>

<script>

// CHANGE THIS PASSWORD
const ACCESS_PASSWORD = "ChangeThisPassword123";

function checkPassword() {
  const input = document.getElementById("passwordInput").value;
  if (input === ACCESS_PASSWORD) {
    document.getElementById("authScreen").style.display = "none";
  } else {
    alert("Unauthorized Access");
  }
}

// ---- FULL CHECKLIST DATA (ALL 13 SECTIONS) ----

const checklist = [

{name:"Admin activity reviewed monthly",desc:"Audit logs reviewed",options:["Weekly","Monthly","Quarterly","Not Reviewed"]},
{name:"Login challenges enabled",desc:"Suspicious login protection",options:["Enforced for All Users","Enforced for High-Risk Users Only","Optional","Not Enabled"]},
{name:"Vault admins protected like super admins",desc:"Same level protection",options:["Same Controls as Super Admins","MFA Only","Standard Protection","Not Applicable"]}

{name:"Compromised account process defined",desc:"Suspend + investigate procedure",options:["Auto Suspend + Investigation Workflow","Manual Investigation","Ad-hoc Handling","No Defined Process"]},

{name:"Less secure apps blocked",desc:"No basic auth apps allowed",options:["Blocked Org-Wide","Blocked for Most Users","Allowed for Specific Accounts","Fully Allowed"]},
{name:"Trusted app allowlist created",desc:"Approved apps only",options:["Allowlist Only Mode","Allowlist + Trusted Apps","Partial Restrictions","No Restrictions"]},

]},
{
section:"Google Sites",
controls:[
{name:"External site sharing blocked",desc:"Prevent public leaks",options:["Disabled Org-Wide","Disabled for Sensitive OUs","Fully Enabled"]}
]},
{
section:"Vault",
controls:[
{name:"Vault admin accounts protected",desc:"Treated like super admins",options:["MFA + Security Keys Required","MFA Required","Standard Protection"]},
{name:"Vault activity audited regularly",desc:"Monitor exports & retention",options:["Monthly","Quarterly","Annually","Not Reviewed"]}
]},
{
section:"Monitoring & Audit",
controls:[
{name:"Security Center reviewed monthly",desc:"Posture visibility",options:["Reviewed Monthly","Reviewed Quarterly","Reviewed Annually","Not Reviewed"]},
{name:"Admin audit logs reviewed monthly",desc:"Track admin activity",options:["Reviewed Weekly","Reviewed Monthly","Reviewed Quarterly","Not Reviewed"]},
{name:"Incident investigation process defined",desc:"Response playbook exists",options:["Documented & Tested","Documented Only","Informal Process","No Defined Process"]}
]}
];

// ----- UI Rendering -----

const app = document.getElementById("app");

checklist.forEach(section => {

  const wrapper = document.createElement("div");
  wrapper.className = "bg-white p-6 rounded-xl shadow border border-gray-200";

  wrapper.innerHTML = `
    <h2 class="text-xl font-semibold mb-6 text-gray-700">${section.section}</h2>
    <div class="overflow-x-auto">
      <table class="min-w-full text-sm border border-gray-200">
        <thead class="bg-gray-50 text-xs uppercase text-gray-600">
          <tr>
            <th class="px-4 py-2 border">Control</th>
            <th class="px-4 py-2 border">Description</th>
            <th class="px-4 py-2 border">Status *</th>
            <th class="px-4 py-2 border">Owner</th>
            <th class="px-4 py-2 border">Evidence</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  `;

  app.appendChild(wrapper);

  const tbody = wrapper.querySelector("tbody");

  section.controls.forEach(control => {

    let optionsHTML = control.options.map(opt => `<option>${opt}</option>`).join("");

    const row = document.createElement("tr");

    row.innerHTML = `
      <td class="px-4 py-2 border font-medium">${control.name}</td>
      <td class="px-4 py-2 border text-gray-600">${control.desc}</td>
      <td class="px-4 py-2 border">
        <select required class="status w-full p-1 border rounded">
          <option value="">Select status</option>
          ${optionsHTML}
        </select>
      </td>
      <td class="px-4 py-2 border">
        <input type="text" class="w-full p-1 border rounded">
      </td>
      <td class="px-4 py-2 border">
        <input type="text" class="w-full p-1 border rounded">
      </td>
    `;

    tbody.appendChild(row);
  });

});

// ----- Completion + Validation -----

function updateCompletion() {
  const selects = document.querySelectorAll(".status");
  let filled = 0;

  selects.forEach(select => {
    if (select.value) {
      filled++;
      select.classList.remove("border-red-500");
    } else {
      select.classList.add("border-red-500");
    }
  });

  const percent = Math.round((filled / selects.length) * 100);
  document.getElementById("overallPercent").innerText = percent + "%";
  document.getElementById("overallBar").style.width = percent + "%";
}

document.addEventListener("change", updateCompletion);

// ----- PDF Export -----

function exportPDF() {
  html2pdf().from(document.body).save("Google_Security_Checklist.pdf");
}

</script>

</body>
</html>
