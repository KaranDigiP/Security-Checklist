function checkPassword() {
  if (document.getElementById("passwordInput").value === ACCESS_PASSWORD) {

}

function makeOptions(arr){
  return arr.map((label,index)=>{
    let score = 0;
    if(index===0) score=100;
    else if(index===1) score=80;
    else if(index===2) score=40;
    else score=0;
    return {label,score};
  });
}

// ---------- STATE ----------

function getState(){
  const rows=document.querySelectorAll("tr[data-id]");
  const state={};
  rows.forEach(r=>{
    state[r.dataset.id]={status:r.querySelector(".status").value};
  });
  return state;
}

function saveState(){ localStorage.setItem("checklistState",JSON.stringify(getState())); }
function loadState(){ return JSON.parse(localStorage.getItem("checklistState")||"{}"); }

let savedState=loadState();

function exportJSON(){
  const blob=new Blob([JSON.stringify(getState(),null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="Checklist_State.json";a.click();
}

function importJSON(e){
  const reader=new FileReader();
  reader.onload=function(ev){
    savedState=JSON.parse(ev.target.result);
    localStorage.setItem("checklistState",JSON.stringify(savedState));
    location.reload();
  };
  reader.readAsText(e.target.files[0]);
}

function exportPDF(){ html2pdf().from(document.body).save("Compliance_Report.pdf"); }

// ---------- RENDER ----------

const app=document.getElementById("app");

checklist.forEach((section,sIndex)=>{

  const wrapper=document.createElement("div");
  wrapper.className="glass p-6";
  wrapper.id="sec-"+sIndex;

  wrapper.innerHTML=`
  <h2 class="text-xl font-semibold mb-4">${section.section} <span class="ml-2 text-sm text-indigo-600" id="secScore-${sIndex}">0%</span></h2>
  <div class="overflow-x-auto">
  <table class="min-w-full text-sm border border-slate-300 rounded-xl overflow-hidden">
  <thead class="bg-slate-100 text-xs uppercase">
  <tr>
  <th class="px-4 py-3 border">Control</th>
  <th class="px-4 py-3 border">Status</th>
  </tr>
  </thead>
  <tbody></tbody>
  </table>
  </div>
  `;

  app.appendChild(wrapper);
  const tbody=wrapper.querySelector("tbody");

  section.controls.forEach((control,cIndex)=>{

    const id=`${sIndex}-${cIndex}`;
    const saved=savedState[id]||{};

    const row=document.createElement("tr");
    row.dataset.id=id;

    row.innerHTML=`
    <td class="px-4 py-3 border">
      <div class="font-medium">${control.name}</div>
      <div class="text-xs text-slate-500">${control.desc}</div>
      <div class="text-xs text-emerald-600 mt-1">Recommended: ${control.recommended}</div>
    </td>
    <td class="px-4 py-3 border">
      <select class="status w-full p-2 border rounded-lg">
        <option value="">Select</option>
        ${control.options.map(o=>`
          <option value="${o.label}" data-score="${o.score}" ${saved.status===o.label?"selected":""}>
            ${o.label}
          </option>`).join("")}
      </select>
    </td>
    `;

    tbody.appendChild(row);
  });
});

// ---------- SCORING ----------

function updateProgress(){

  let totalScore=0;
  let totalControls=0;

  checklist.forEach((section,sIndex)=>{

    let sectionScore=0;

    section.controls.forEach((control,cIndex)=>{

      const id=`${sIndex}-${cIndex}`;
      const row=document.querySelector(`tr[data-id="${id}"]`);
      const select=row.querySelector(".status");
      const selected=select.options[select.selectedIndex];
      const score=selected?Number(selected.dataset.score||0):0;

      sectionScore+=score;
      totalScore+=score;
      totalControls++;
    });

    const secPercent=Math.round(sectionScore/section.controls.length);
    document.getElementById(`secScore-${sIndex}`).innerText=secPercent+"%";
  });

  const overallPercent=Math.round(totalScore/totalControls);
  document.getElementById("overallPercent").innerText=overallPercent+"%";
  document.getElementById("overallBar").style.width=overallPercent+"%";
  saveState();
}

document.addEventListener("change",updateProgress);
