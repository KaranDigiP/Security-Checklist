<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine?</title>

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Comic Sans MS', cursive;
  background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #ffdde1, #ffc3a0);
  background-size: 400% 400%;
  animation: gradient 8s ease infinite;
}

@keyframes gradient {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.container {
  background: rgba(255,255,255,0.9);
  padding: 50px;
  border-radius: 30px;
  text-align: center;
  box-shadow: 0 25px 50px rgba(0,0,0,0.2);
  position: relative;
  z-index: 2;
}

h1 {
  font-size: 2.7rem;
  color: #ff4d6d;
  margin-bottom: 30px;
}

button {
  padding: 15px 35px;
  font-size: 1.3rem;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  transition: 0.3s ease;
  margin: 15px;
}

#yesBtn {
  background: #ff4d6d;
  color: white;
}

#noBtn {
  background: #777;
  color: white;
  position: absolute;
}

button:hover {
  transform: scale(1.1);
}

/* Cats placed safely at edges */
.cat {
  position: absolute;
  width: 120px;
  z-index: 1;
  animation: floatCats 5s ease-in-out infinite alternate;
}

@keyframes floatCats {
  from { transform: translateY(0px); }
  to { transform: translateY(-20px); }
}

.cat1 { bottom: 10px; left: 10px; }
.cat2 { bottom: 10px; right: 10px; }
.cat3 { top: 10px; left: 10px; }
.cat4 { top: 10px; right: 10px; }

/* Floating celebration */
.heart, .paw {
  position: absolute;
  animation: floatUp 5s linear infinite;
}

@keyframes floatUp {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-100vh); opacity: 0; }
}
</style>
</head>

<body>

<div class="container">
  <h1>Will you be my Valentine? 💖🐾</h1>
  <button id="yesBtn">Yes 😍</button>
  <button id="noBtn">No 🙅</button>
</div>

<!-- Edge Cats Only -->
<img src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif" class="cat cat1">
<img src="https://media.giphy.com/media/mlvseq9yvZhba/giphy.gif" class="cat cat2">
<img src="https://media.giphy.com/media/ICOgUNjpvO0PC/giphy.gif" class="cat cat3">
<img src="https://media.giphy.com/media/13borq7Zo2kulO/giphy.gif" class="cat cat4">

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");

let yesScale = 1;
let escapeCount = 0;
const minEscapes = 6;

function moveNoButton() {
  const padding = 100;
  const x = Math.random() * (window.innerWidth - padding);
  const y = Math.random() * (window.innerHeight - padding);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

noBtn.addEventListener("mouseover", () => {
  escapeCount++;

  // Teleport at least 6 times
  if (escapeCount <= minEscapes) {
    for (let i = 0; i < 6; i++) {
      setTimeout(moveNoButton, i * 80);
    }
  } else {
    moveNoButton();
  }

  // Grow Yes button
  yesScale += 0.25;
  yesBtn.style.transform = `scale(${yesScale})`;
});

yesBtn.addEventListener("click", () => {
  document.body.innerHTML = `
    <div style="text-align:center;">
      <h1 style="font-size:3rem;color:#ff4d6d;">SHE SAID YESSSS 😭💖🐾</h1>
      <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" width="300">
    </div>
  `;
  startCelebration();
});

function startCelebration() {
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.bottom = "0px";
    heart.style.fontSize = Math.random() * 30 + 20 + "px";
    document.body.appendChild(heart);

    const paw = document.createElement("div");
    paw.className = "paw";
    paw.innerHTML = "🐾";
    paw.style.left = Math.random() * window.innerWidth + "px";
    paw.style.bottom = "0px";
    paw.style.fontSize = Math.random() * 25 + 15 + "px";
    document.body.appendChild(paw);

    setTimeout(() => {
      heart.remove();
      paw.remove();
    }, 5000);
  }, 200);
}
</script>

</body>
</html>
