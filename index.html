<!DOCTYPE html>
<html>
<head>
  <title>Google Security Checklist</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
  <h1 class="text-3xl font-bold mb-8">Google Security Checklist</h1>
  <div id="app" class="space-y-10"></div>

<script>
const checklist = [

{
section: "Administrator Accounts",
controls: [
{name:"Super Admin accounts minimized",desc:"Limit number of super admins",options:["1 Super Admin","2 Super Admins (Recommended)","3–5 Super Admins","More than 5","Not Reviewed"]},
{name:"Security keys enforced for admins",desc:"FIDO2 keys required",options:["Required for All Admins","Required for Super Admins Only","Optional","Not Enforced"]},
{name:"Admin email alerts enabled",desc:"Risk alerts configured",options:["Enabled for All Risk Events","Enabled for Critical Events Only","Partially Configured","Not Enabled"]},
{name:"Admin activity reviewed monthly",desc:"Audit logs reviewed",options:["Weekly","Monthly","Quarterly","Not Reviewed"]},
{name:"Login challenges enabled",desc:"Suspicious login protection",options:["Enforced for All Users","Enforced for High-Risk Users Only","Optional","Not Enabled"]},
{name:"Vault admins protected like super admins",desc:"Same level protection",options:["Same Controls as Super Admins","MFA Only","Standard Protection","Not Applicable"]}
]},

{
section:"User Account Security",
controls:[
{name:"2-Step Verification enforced",desc:"MFA required for all users",options:["Enforced for All Users","Enforced for Admins Only","Optional","Not Enabled"]},
{name:"Password reuse prevention enabled",desc:"Password Alert active",options:["Enabled Org-Wide","Enabled for Selected OUs","Not Enabled","Not Deployed"]},
{name:"Unique password policy enforced",desc:"Strong password standards",options:["Strong Policy (Length + Complexity)","Basic Policy","Default Google Policy","Not Enforced"]},
{name:"Compromised account process defined",desc:"Suspend + investigate procedure",options:["Auto Suspend + Investigation Workflow","Manual Investigation","Ad-hoc Handling","No Defined Process"]},
{name:"Google Takeout restricted",desc:"Data download controlled",options:["Disabled Org-Wide","Disabled for Sensitive OUs","Enabled with Monitoring","Fully Enabled"]},
{name:"Offboarding process defined",desc:"Immediate access revocation",options:["Immediate Suspension + Data Review","Suspension Only","Manual Process","No Formal Process"]}
]},

{
section:"App & Third-Party Access Control",
controls:[
{name:"Third-party app access reviewed",desc:"OAuth apps audited",options:["Reviewed Monthly","Reviewed Quarterly","Reviewed Annually","Not Reviewed"]},
{name:"Less secure apps blocked",desc:"No basic auth apps allowed",options:["Blocked Org-Wide","Blocked for Most Users","Allowed for Specific Accounts","Fully Allowed"]},
{name:"Trusted app allowlist created",desc:"Approved apps only",options:["Allowlist Only Mode","Allowlist + Trusted Apps","Partial Restrictions","No Restrictions"]},
{name:"Context-Aware Access enabled",desc:"Device/IP-based access control",options:["Enforced (Device + IP)","Enforced (IP Only)","Enforced (Device Only)","Not Configured"]},
{name:"Client-side encryption evaluated",desc:"Encryption for sensitive data",options:["Enabled for Sensitive OUs","Enabled Org-Wide","Evaluated but Deferred","Not Evaluated"]}
]},

{
section:"Calendar Security",
controls:[
{name:"External sharing limited to free/busy",desc:"Restrict event details",options:["Free/Busy Only","Limited Details","Full Details","Public"]},
{name:"External guest warning enabled",desc:"Alert on outside invites",options:["Enabled Org-Wide","Enabled for Selected OUs","Disabled"]}
]},

{
section:"Google Chat Controls",
controls:[
{name:"External chat restricted",desc:"Limit outside messaging",options:["Disabled Org-Wide","Allowed for Selected OUs","Fully Enabled"]},
{name:"Chat invitation policy set",desc:"Auto-accept rules defined",options:["Manual Approval Required","Auto Accept Internal Only","Fully Automatic","Not Configured"]}
]},

{
section:"Chrome & Browser Policies",
controls:[
{name:"Chrome auto-updates enabled",desc:"Browser always updated",options:["Auto Update + Forced Restart","Auto Update (User Restart)","Manual Updates","Not Managed"]},
{name:"Force relaunch policy set",desc:"Enforce update restart",options:["Forced After Deadline","User Reminder Only","Not Configured"]},
{name:"Safe Browsing always enabled",desc:"Phishing protection active",options:["Always Enforced","Standard Mode","User Controlled","Disabled"]},
{name:"Malicious download blocking enabled",desc:"Download restrictions set",options:["Block Dangerous & Malicious","Block Malicious Only","Warn Only","No Restriction"]},
{name:"SitePerProcess enabled",desc:"Process isolation enabled",options:["Enabled","Disabled","Not Managed"]},
{name:"AllowedDomainsForApps configured",desc:"Domain restriction policy",options:["Restricted to Company Domains","Restricted + Trusted Domains","Not Configured"]}
]},

{
section:"Endpoint & Device Management",
controls:[
{name:"Device management enabled",desc:"Endpoint control active",options:["Advanced Management","Basic Management","Not Enabled"]},
{name:"Device encryption enforced",desc:"Full disk encryption required",options:["Required Org-Wide","Required for Admins Only","Recommended Only","Not Enforced"]},
{name:"Screen lock enforced",desc:"Mandatory device lock",options:["Mandatory with Timeout Policy","Mandatory without Timeout","Not Enforced"]},
{name:"Admin access restricted to managed devices",desc:"Privileged device control",options:["Required for All Admin Roles","Required for Super Admins Only","Not Restricted"]}
]},

{
section:"Google Drive Security",
controls:[
{name:"External sharing restricted",desc:"Sharing limited to allowlist",options:["Disabled Completely","Allowlisted Domains Only","Allowed with Warning","Fully Allowed"]},
{name:"Public publishing disabled",desc:"No web publishing",options:["Disabled Org-Wide","Disabled for Sensitive OUs","Enabled"]},
{name:"Default access set to Restricted",desc:"Private by default",options:["Restricted by Default","Internal Only","Anyone with Link","Not Configured"]},
{name:"Access Checker set to Recipients Only",desc:"Link control enabled",options:["Recipients Only","Anyone with Warning","Disabled"]},
{name:"Shared drive creation restricted",desc:"Limit sprawl",options:["Admin Only","Restricted Group Only","All Users"]},
{name:"External collaborators require sign-in",desc:"No anonymous access",options:["Google Account Required","Trusted Domains Only","Anonymous Allowed"]},
{name:"Offline docs disabled",desc:"Prevent local copies",options:["Disabled Org-Wide","Disabled for Sensitive OUs","Enabled"]},
{name:"Desktop sync restricted",desc:"Limit Drive for desktop",options:["Disabled Org-Wide","Restricted to Specific Users","Fully Enabled"]},
{name:"DLP rules configured",desc:"Sensitive data detection",options:["Block Sensitive Data Sharing","Warn Only","Monitor Only","Not Configured"]}
]},

{
section:"Gmail Security",
controls:[
{name:"SPF configured",desc:"Domain authentication",options:["Configured & Verified","Configured (Unverified)","Not Configured"]},
{name:"DKIM enabled",desc:"Email signing",options:["Enabled with Key Rotation","Enabled","Not Enabled"]},
{name:"DMARC enforced",desc:"Anti-spoofing policy",options:["p=reject","p=quarantine","p=none","Not Configured"]},
{name:"TLS required for partners",desc:"Secure email transport",options:["Required for All Partners","Required for Specific Domains","Opportunistic TLS Only","Not Configured"]},
{name:"IMAP/POP disabled",desc:"Reduce data exfiltration",options:["Disabled Org-Wide","Disabled for Most Users","Enabled for Approved Users","Fully Enabled"]},
{name:"Auto-forwarding disabled",desc:"Prevent silent leaks",options:["Disabled Org-Wide","Disabled for Sensitive OUs","Allowed with Approval","Fully Enabled"]},
{name:"Enhanced phishing protection enabled",desc:"Advanced scanning",options:["Enabled Org-Wide","Enabled for Selected OUs","Standard Only","Not Enabled"]},
{name:"Attachment protection enabled",desc:"Malware detection",options:["Enhanced Enabled","Standard Only","Disabled"]},
{name:"Link protection enabled",desc:"Phishing URL blocking",options:["Enhanced Enabled","Standard Only","Disabled"]},
{name:"Spoofing protection enabled",desc:"Anti-impersonation",options:["Enhanced Enabled","Standard Only","Disabled"]},
{name:"Spam filter not bypassed internally",desc:"No spoof loopholes",options:["Bypass Disabled","Bypass Enabled for Specific Groups","Bypass Fully Enabled"]},
{name:"DLP scanning for outgoing email",desc:"Sensitive data blocking",options:["Block Sensitive Content","Warn Only","Monitor Only","Not Configured"]}
]},

{
section:"Google Groups Security",
controls:[
{name:"Group creation restricted to admins",desc:"Prevent group sprawl",options:["Admin Only","Restricted Users","All Users"]},
{name:"Security groups used for access control",desc:"Secure resource control",options:["Used for All Sensitive Resources","Used for Some Resources","Not Used"]},
{name:"External posting disabled for internal groups",desc:"Reduce data leaks",options:["Disabled Org-Wide","Disabled for Internal Groups Only","Fully Enabled"]},
{name:"Public access disabled",desc:"No internet access",options:["Disabled","Restricted","Public"]},
{name:"Spam moderation enabled",desc:"Reduce phishing",options:["Auto Reject Spam","Moderator Approval Required","Not Enabled"]}
]},

{
section:"Google Sites",
controls:[
{name:"External site sharing blocked",desc:"Prevent public leaks",options:["Disabled Org-Wide","Disabled for Sensitive OUs","Fully Enabled"]}
]},

{
section:"Vault",
controls:[
{name:"Vault admin accounts protected",desc:"Treated like super admins",options:["MFA + Security Keys Required","MFA Required","Standard Protection"]},
{name:"Vault activity audited regularly",desc:"Monitor exports & retention",options:["Monthly","Quarterly","Annually","Not Reviewed"]}
]},

{
section:"Monitoring & Audit",
controls:[
{name:"Security Center reviewed monthly",desc:"Posture visibility",options:["Reviewed Monthly","Reviewed Quarterly","Reviewed Annually","Not Reviewed"]},
{name:"Admin audit logs reviewed monthly",desc:"Track admin activity",options:["Reviewed Weekly","Reviewed Monthly","Reviewed Quarterly","Not Reviewed"]},
{name:"Incident investigation process defined",desc:"Response playbook exists",options:["Documented & Tested","Documented Only","Informal Process","No Defined Process"]}
]}
];

// Render UI
const app = document.getElementById("app");

checklist.forEach(section => {
  const wrapper = document.createElement("div");
  wrapper.className = "bg-white p-6 rounded-xl shadow";
  wrapper.innerHTML = `<h2 class="text-xl font-semibold mb-4">${section.section}</h2>`;

  section.controls.forEach(control => {
    const div = document.createElement("div");
    div.className = "mb-4";

    let optionsHTML = control.options.map(opt => `<option>${opt}</option>`).join("");

    div.innerHTML = `
      <label class="font-medium">${control.name}</label>
      <p class="text-sm text-gray-500 mb-1">${control.desc}</p>
      <select class="w-full p-2 border rounded">
        <option value="">Select status</option>
        ${optionsHTML}
      </select>
    `;

    wrapper.appendChild(div);
  });

  app.appendChild(wrapper);
});
</script>

</body>
</html>
