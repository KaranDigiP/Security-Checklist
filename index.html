<html>
<head>
  <title>Google Security Checklist - Premium</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    html { scroll-behavior: smooth; }

    body {
      margin:0;
      background: linear-gradient(135deg,#dbeafe,#f8fafc);
      min-height:100vh;
      overflow-x:hidden;
    }

    /* Subtle parallax */
    body::before {
      content:'';
      position:fixed;
      top:-50%;
      left:-50%;
      width:200%;
      height:200%;
      background: radial-gradient(circle at 30% 30%, rgba(99,102,241,0.15), transparent 60%),
                  radial-gradient(circle at 70% 70%, rgba(16,185,129,0.15), transparent 60%);
      z-index:-1;
      animation: float 20s infinite linear;
    }

    @keyframes float {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .glass {
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(22px) saturate(180%);
      border-radius:20px;
      border:1px solid rgba(255,255,255,0.4);
      box-shadow:0 8px 32px rgba(0,0,0,0.1);
    }

    .side-nav {
      position:fixed;
      left:20px;
      top:120px;
      width:250px;
      max-height:70vh;
      overflow:auto;
    }

    .side-nav button {
      width:100%;
      text-align:left;
      padding:8px 12px;
      border-radius:10px;
      transition:0.2s;
    }

    .side-nav button:hover {
      background:#e0e7ff;
      transform:translateX(4px);
    }

    .btn {
      padding:10px 16px;
      border-radius:12px;
      font-weight:500;
      transition:0.2s;
    }

    .btn:hover {
      transform:scale(1.05);
      box-shadow:0 4px 14px rgba(0,0,0,0.15);
    }
  </style>
</head>

<body class="p-8 text-slate-800">

<!-- PASSWORD -->
<div id="authScreen" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-50">
  <div class="bg-white p-10 rounded-2xl shadow-2xl w-96 text-center">
    <h2 class="text-2xl font-bold mb-6">🔐 Secure Access</h2>
    <input type="password" id="passwordInput"
      class="w-full p-3 border rounded-lg mb-4"
      placeholder="Enter Access Password">
    <button onclick="checkPassword()"
      class="w-full bg-indigo-600 text-white p-3 rounded-lg hover:bg-indigo-700 transition">
      Access
    </button>
  </div>
</div>

<!-- HEADER -->
<div class="glass p-6 mb-8 sticky top-4 z-40 ml-72">
  <div class="flex justify-between items-center flex-wrap gap-4">
    <h1 class="text-3xl font-bold">Google Security Checklist</h1>
    <div class="flex gap-3 flex-wrap">
      <button onclick="exportJSON()" class="btn bg-indigo-600 text-white">Export JSON</button>
      <label class="btn bg-emerald-600 text-white cursor-pointer">
        Import JSON
        <input type="file" hidden onchange="importJSON(event)">
      </label>
      <button onclick="exportPDF()" class="btn bg-slate-900 text-white">Export PDF</button>
    </div>
  </div>

  <div class="mt-6">
    <div class="flex justify-between text-sm mb-2">
      <span>Overall Completion</span>
      <span id="overallPercent" class="font-semibold text-indigo-600">0%</span>
    </div>
    <div class="w-full bg-slate-200 rounded-full h-3">
      <div id="overallBar" class="bg-indigo-600 h-3 rounded-full transition-all duration-700" style="width:0%"></div>
    </div>
  </div>
</div>

<!-- SIDE NAV -->
<div class="side-nav glass p-4 hidden lg:block" id="sideNav"></div>

<div id="app" class="space-y-8 ml-72"></div>

<script>

  if (document.getElementById("passwordInput").value === ACCESS_PASSWORD) {

}

// ============ LOGIC ============



// STATE
function getState() {
  const rows=document.querySelectorAll("tr[data-id]");
  const state={};
  rows.forEach(r=>{
    state[r.dataset.id]={
      status:r.querySelector(".status").value,
      owner:r.querySelector(".owner").value,
      evidence:r.querySelector(".evidence").value
    };
  });
  return state;
}

function saveState(){ localStorage.setItem("checklistState",JSON.stringify(getState())); }
function loadState(){ return JSON.parse(localStorage.getItem("checklistState")||"{}"); }

let savedState=loadState();

function exportJSON(){
  const blob=new Blob([JSON.stringify(getState(),null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="Checklist_State.json"; a.click();
}

function importJSON(e){
  const reader=new FileReader();
  reader.onload=function(ev){
    savedState=JSON.parse(ev.target.result);
    localStorage.setItem("checklistState",JSON.stringify(savedState));
    location.reload();
  };
  reader.readAsText(e.target.files[0]);
}

function exportPDF(){ html2pdf().from(document.body).save("Checklist.pdf"); }

const app=document.getElementById("app");
const sideNav=document.getElementById("sideNav");

checklist.forEach((section,sIndex)=>{

  // Side nav
  const navBtn=document.createElement("button");
  navBtn.innerText=section.section;
  navBtn.onclick=()=>document.getElementById("sec-"+sIndex).scrollIntoView({behavior:"smooth"});
  sideNav.appendChild(navBtn);

  const wrapper=document.createElement("div");
  wrapper.id="sec-"+sIndex;
  wrapper.className="glass p-6 fade";

  wrapper.innerHTML=`
    <h2 class="text-xl font-semibold mb-4">${section.section}</h2>
    <div class="overflow-x-auto">
      <table class="min-w-full text-sm border border-slate-300 rounded-xl overflow-hidden">
        <thead class="bg-slate-100 text-xs uppercase">
          <tr>
            <th class="px-4 py-3 border">Control</th>
            <th class="px-4 py-3 border">Description</th>
            <th class="px-4 py-3 border">Status</th>
            <th class="px-4 py-3 border">Owner</th>
            <th class="px-4 py-3 border">Evidence</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>`;

  app.appendChild(wrapper);
  const tbody=wrapper.querySelector("tbody");

  section.controls.forEach((control,cIndex)=>{
    const id=`${sIndex}-${cIndex}`;
    const saved=savedState[id]||{};

    const row=document.createElement("tr");
    row.dataset.id=id;

    row.innerHTML=`
      <td class="px-4 py-3 border font-medium">${control.name}</td>
      <td class="px-4 py-3 border text-slate-600">${control.desc}</td>
      <td class="px-4 py-3 border">
        <select class="status w-full p-2 border rounded-lg">
          <option value="">Select</option>
          ${control.options.map(o=>`<option ${saved.status===o?"selected":""}>${o}</option>`).join("")}
        </select>
      </td>
      <td class="px-4 py-3 border"><input type="text" value="${saved.owner||""}" class="owner w-full p-2 border rounded-lg"></td>
      <td class="px-4 py-3 border"><input type="text" value="${saved.evidence||""}" class="evidence w-full p-2 border rounded-lg"></td>
    `;
    tbody.appendChild(row);
  });

});

function updateProgress(){
  const selects=document.querySelectorAll(".status");
  let filled=0;
  selects.forEach(s=>{ if(s.value)filled++; });
  const percent=Math.round((filled/selects.length)*100);
  document.getElementById("overallPercent").innerText=percent+"%";
  document.getElementById("overallBar").style.width=percent+"%";
  saveState();
}

document.addEventListener("change",updateProgress);
document.addEventListener("input",saveState);
updateProgress();

</html>
