<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine?</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Comic Sans MS', cursive, sans-serif;
  background: linear-gradient(270deg, #ff9a9e, #fad0c4, #ffdde1);
  background-size: 600% 600%;
  animation: gradientShift 10s ease infinite;
  overflow: hidden;
}

@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.container {
  text-align: center;
  background: rgba(255,255,255,0.8);
  padding: 40px;
  border-radius: 25px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  position: relative;
}

h1 {
  font-size: 2.5rem;
  color: #ff4d6d;
  margin-bottom: 30px;
}

button {
  padding: 15px 30px;
  font-size: 1.2rem;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  transition: 0.3s ease;
  margin: 10px;
}

#yesBtn {
  background-color: #ff4d6d;
  color: white;
}

#noBtn {
  background-color: #999;
  color: white;
  position: absolute;
}

button:hover {
  transform: scale(1.1);
}

.cat {
  position: absolute;
  width: 120px;
}

.cat1 { bottom: 10px; left: 10px; }
.cat2 { bottom: 10px; right: 10px; }

.heart {
  position: absolute;
  color: red;
  font-size: 20px;
  animation: floatUp 4s linear infinite;
}

@keyframes floatUp {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-800px); opacity: 0; }
}
</style>
</head>

<body>

<div class="container">
  <h1>Will you be my Valentine? 💖</h1>
  <button id="yesBtn">Yes 😍</button>
  <button id="noBtn">No 🙃</button>
</div>

<img src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif" class="cat cat1">
<img src="https://media.giphy.com/media/mlvseq9yvZhba/giphy.gif" class="cat cat2">

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
let yesSize = 1;

noBtn.addEventListener("mouseover", function() {
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 100);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  yesSize += 0.2;
  yesBtn.style.transform = "scale(" + yesSize + ")";
});

yesBtn.addEventListener("click", function() {
  document.body.innerHTML = `
    <div style="text-align:center;">
      <h1 style="color:#ff4d6d;font-size:3rem;">YAYYYYYY!!! 💕💕💕</h1>
      <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" width="300">
    </div>
  `;
  createHearts();
});

function createHearts() {
  setInterval(() => {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.bottom = "0px";
    heart.style.fontSize = Math.random() * 30 + 20 + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 4000);
  }, 200);
}
</script>

</body>
</html>
